<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEE440"/>
      <stop offset="25%" stop-color="#FF5A5F"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="75%" stop-color="#C13584"/>
      <stop offset="100%" stop-color="#833AB4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97757" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Outer Camera Contour -->
    <rect x="14" y="20" width="72" height="62" rx="20" ry="20" fill="none" stroke="url(#igGradient)" stroke-width="7"/>
    
    <!-- Camera Lens Ring -->
    <circle cx="44" cy="51" r="18" fill="none" stroke="url(#igGradient)" stroke-width="6.5"/>
    
    <!-- Camera Flash Dot -->
    <circle cx="70" cy="34" r="4.5" fill="url(#igGradient)"/>
    
    <!-- Overlaid Automation Lightning Bolt Arrow -->
    <path d="M 68 8 L 44 48 L 58 48 L 36 88 L 84 40 L 64 40 Z" fill="url(#igGradient)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
